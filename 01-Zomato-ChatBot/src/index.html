<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tomato Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="22" r="14" fill="#fff" />
          <circle cx="20" cy="22" r="11" fill="#d8322a" />
          <path
            d="M20 9c-1 3-4 4-7 4 2 1 4 1 7 0 3 1 5 1 7 0-3 0-6-1-7-4z"
            fill="#2f8f4e"
          />
        </svg>
        <div>
          <h1>Tomato Support</h1>
          <div class="status">
            <span class="dot"></span>We reply in a few seconds
          </div>
        </div>
      </header>

      <section
        class="messages"
        id="messages"
        aria-live="polite"
        aria-label="Conversation"
      ></section>

      <section class="quick" aria-label="Quick help topics">
        <p class="quick-title">Pick a topic or type your question</p>
        <div class="chips" id="chips"></div>
      </section>

      <form class="composer" id="composer">
        <textarea
          id="input"
          rows="1"
          maxlength="1000"
          placeholder="Describe your order issue..."
          aria-label="Your message"
        ></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </form>
      <p class="hint">
        Tomato Support can help with orders, refunds, tracking and policies.
      </p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
